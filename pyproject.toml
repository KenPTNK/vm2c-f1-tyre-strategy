[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vm2c"
version = "1.0.0"
description = "F1 pit-stop & tyre strategy models from VM2C 2026 (team 2026024): exact optimiser, robust Monte Carlo, fuel model."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
a6 = ["fastf1>=3.4", "pandas>=2.0"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["vm2c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
